# Central Settings for Google ADK Multi-Agent System
app:
  name: "Google ADK Multi-Agent System"
  version: "1.0.0"
  description: "Modular multi-agent architecture built with Google GenAI / ADK"

models:
  default: "gemini-3.5-flash"
  reasoning: "gemini-3.5-flash"
  creative: "gemini-3.5-flash"
  fast: "gemini-3.5-flash"

generation:
  temperature: 0.7
  top_p: 0.95
  top_k: 40
  max_output_tokens: 4096

agents:
  agent1:
    id: "agent1"
    name: "Orchestrator_Agent"
    role: "Primary Task Ingestion & Orchestration"
    model: "gemini-3.5-flash"
    temperature: 0.3
    enabled: true

  agent2:
    id: "agent2"
    name: "Specialist_Agent_A"
    role: "Domain Analysis & Feature Extraction"
    model: "gemini-3.5-flash"
    temperature: 0.2
    enabled: true

  agent3:
    id: "agent3"
    name: "Specialist_Agent_B"
    role: "Quantitative Analysis & Verification"
    model: "gemini-3.5-flash"
    temperature: 0.1
    enabled: true

orchestrator:
  strategy: "autonomous_routing"
  max_iterations: 6
  timeout_seconds: 60